<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bento brief</title>
<meta name="description" content="Ton brief Slack, Gmail et Studio KLIMB en quelques secondes">
<meta name="theme-color" content="#8CC3E4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14201A;
    --ink-2: #364339;
    --forest: #1E3A2B;
    --accent: #D7F75B;
    --cream: #F5F1D4;
    --glass: rgba(252, 250, 238, 0.74);
    --glass-border: rgba(255, 255, 255, 0.7);
    --hot: #8A2E12;
    --hot-bg: #FFD9CC;
    --coral: #FF8A65;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --serif: 'Instrument Serif', 'New York', Georgia, serif;
    --sans: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--cream); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; }

  /* Fond : dégradé mesh ciel, soleil, végétal + grain léger */
  .scenery {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background:
      radial-gradient(55% 40% at 80% 6%, rgba(255, 244, 186, 0.95) 0%, rgba(255, 244, 186, 0) 70%),
      radial-gradient(60% 45% at 8% 4%, rgba(132, 192, 230, 0.9) 0%, rgba(132, 192, 230, 0) 72%),
      radial-gradient(70% 45% at 50% 42%, rgba(214, 233, 170, 0.9) 0%, rgba(214, 233, 170, 0) 75%),
      radial-gradient(75% 55% at 95% 78%, rgba(96, 148, 62, 0.95) 0%, rgba(96, 148, 62, 0) 72%),
      radial-gradient(80% 60% at 0% 100%, rgba(52, 102, 52, 0.95) 0%, rgba(52, 102, 52, 0) 72%),
      linear-gradient(180deg, #A6D0EA 0%, #E8EECB 32%, #BCD78E 58%, #7DAA4E 82%, #4E8436 100%);
  }
  .scenery::after {
    content: ''; position: absolute; inset: 0; opacity: 0.18; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; will-change: transform; }
  .b1 { width: 55vmax; height: 40vmax; left: -10vmax; top: 18%; background: #CFE7A6; animation: drift1 26s ease-in-out infinite alternate; }
  .b2 { width: 45vmax; height: 35vmax; right: -12vmax; top: -6%; background: #FFEFB0; opacity: 0.6; animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 60vmax; height: 40vmax; right: -15vmax; bottom: -12%; background: #5E9440; opacity: 0.5; animation: drift3 38s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(8vmax, -4vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-6vmax, 5vmax) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-10vmax, -3vmax) scale(0.95); } }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }

  .app {
    position: relative; z-index: 1;
    max-width: 1240px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 12px;
  }

  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 10px 28px rgba(30,58,43,0.10);
  }
  .dark {
    background: rgba(24, 46, 34, 0.8);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid rgba(255,255,255,0.14);
    color: #F4F1E4;
  }
  /* Typo : texte courant 15-16px, méta 13px minimum, pas de petites capitales */
  .muted { color: var(--ink-2); }
  .mono { font-variant-numeric: tabular-nums; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--forest); outline-offset: 3px; border-radius: 12px; }
  .dark a:focus-visible { outline-color: var(--accent); }

  /* Barre du haut */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pill { height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 20px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill small { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .round { width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); padding: 0; }
  .loading .round svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .right { display: flex; gap: 8px; align-items: center; }

  header.hello { padding: 16px 4px 8px; }
  header.hello h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(48px, 8vw, 64px); line-height: 0.95; letter-spacing: -0.01em; }
  header.hello h1 em { font-style: italic; }
  header.hello p { margin: 10px 0 0; font-size: 18px; line-height: 1.4; font-weight: 500; color: var(--ink); max-width: 40ch; }

  .banner { align-self: flex-start; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: var(--forest); color: var(--accent); }

  /* Grille bento */
  .grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  .grid > * { order: var(--o-m, 0); min-width: 0; }
  .list { display: grid; grid-template-columns: minmax(0, 1fr); }
  .tile { border-radius: 28px; padding: 20px; min-width: 0; }
  .tile-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
  .tile-head h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px; font-size: 14px; font-weight: 700; background: var(--forest); color: var(--accent); font-variant-numeric: tabular-nums; }
  .tile-head { flex-wrap: wrap; }
  .head-actions { display: inline-flex; align-items: center; gap: 14px; margin-left: auto; }
  .tile-head a { font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; padding: 10px 0; }

  /* L'essentiel */
  .brief { background: var(--accent); color: var(--ink); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 16px 40px rgba(47,74,16,0.22); }
  .brief .tile-head h2 { font-size: 22px; }
  .brief .tile-head span { font-size: 14px; font-weight: 500; color: #2E3F10; }
  .brief strong { font-weight: 700; }
  .top { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 20px; background: rgba(255,255,255,0.45); }
  .overline { font-size: 14px; font-weight: 700; color: #2E3F10; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .overline .prio { padding: 3px 10px; border-radius: 999px; background: var(--forest); color: var(--accent); font-size: 13px; }
  .top p { margin: 0; font-size: 24px; line-height: 1.28; letter-spacing: -0.015em; }
  .cta { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 24px; background: var(--forest); color: var(--accent); font-size: 16px; font-weight: 700; text-decoration: none; }
  .rest { display: grid; gap: 14px; }
  .rest-item { display: flex; gap: 14px; align-items: baseline; text-decoration: none; padding: 2px 0; }
  .rest-item .n { font-family: var(--serif); font-size: 28px; line-height: 1; min-width: 18px; }
  .rest-item p { margin: 0; font-size: 17px; line-height: 1.4; }
  .rest-item .meta { display: block; margin-top: 4px; font-size: 13px; font-weight: 600; color: #34471A; }
  .brief-foot { font-size: 14px; color: #2E3F10; }

  /* Compteurs */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .stat { border-radius: 22px; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px; }
  .stat .k { font-size: 16px; font-weight: 700; }
  .stat .v { font-family: var(--serif); font-size: 48px; line-height: 0.95; }
  .stat .v.hot { color: #B23F18; }
  .stat .s { font-size: 14px; color: var(--ink-2); line-height: 1.3; }

  /* Listes */
  .mails { }
  .row { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid rgba(20,32,26,0.12); text-decoration: none; color: inherit; }
  .avatar { width: 42px; height: 42px; border-radius: 21px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; color: var(--ink); }
  .row-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .row-top b { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .subject { font-size: 15px; line-height: 1.4; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: 14px; color: var(--ink-2); }
  .tag { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .tag.urgent { background: var(--hot-bg); color: var(--hot); }
  .tag.client { background: #E4F7A8; color: #2F4A10; }
  .tag.valider { background: rgba(20,32,26,0.1); color: var(--ink); }
  .tag.info { background: #D7E9F2; color: #1D3A4A; }
  /* Chaque message est une carte cliquable */
  .list { row-gap: 8px; column-gap: 10px; margin-top: 6px; align-content: start; }
  a.row { border-top: 0; padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.45); transition: background 0.15s, transform 0.15s; }
  a.row:hover { background: rgba(255,255,255,0.8); }
  a.row:active { transform: scale(0.99); }
  .slack a.row { background: rgba(255,255,255,0.06); border-top: 0; }
  .slack a.row:hover { background: rgba(255,255,255,0.13); }
  .time { display: inline-flex; align-items: center; gap: 6px; }
  .go { opacity: 0.55; flex-shrink: 0; }
  a.row:hover .go { opacity: 1; }
  a.rest-item { border-radius: 12px; }
  a.rest-item:hover p { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .foot { font-size: 14px; color: var(--ink-2); padding-top: 12px; border-top: 1px solid rgba(20,32,26,0.12); }

  .slack { }
  .slack .tile-head a { color: #F4F1E4; }
  .slack .badge { background: var(--accent); color: var(--forest); }
  .slack .row { flex-direction: column; gap: 6px; border-top-color: rgba(255,255,255,0.14); }
  .slack .row-top b { font-size: 16px; }
  .slack .where { font-size: 14px; font-weight: 500; color: #C9D6C4; }
  .slack .time { color: #C9D6C4; }
  .slack .txt { font-size: 15px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .slack .empty { color: #C9D6C4; }
  .udot { display: inline-block; width: 10px; height: 10px; border-radius: 5px; background: var(--accent); margin-right: 8px; }
  .await { align-self: flex-start; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--accent); color: var(--forest); }
  .slack .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .slack .msgs { font-size: 13px; color: #C9D6C4; }

  /* Studio timeline */
  .studio { display: flex; flex-direction: column; gap: 8px; }
  .timeline { position: relative; display: flex; flex-direction: column; gap: 20px; padding: 8px 0; }
  .timeline::before { content: ''; position: absolute; left: 10px; top: 16px; bottom: 16px; width: 2px; background: var(--forest); opacity: 0.25; }
  .proj { position: relative; display: flex; gap: 14px; align-items: flex-start; }
  .dot { width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; border: 2px solid var(--forest); background: rgba(252,250,238,0.95); }
  .dot.hot { background: var(--coral); }
  .dot.done { background: var(--forest); }
  .proj-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .proj-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .proj-top b { font-size: 16px; font-weight: 700; }
  .proj .what { font-size: 14px; color: var(--ink-2); }
  .due { font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--ink-2); }
  .due.hot { color: var(--hot); font-weight: 700; }
  .bar { height: 6px; border-radius: 3px; background: rgba(20,32,26,0.12); margin-top: 4px; }
  .bar i { display: block; height: 6px; border-radius: 3px; background: var(--forest); }

  .empty { font-size: 15px; line-height: 1.45; color: var(--ink-2); padding: 10px 0; margin: 0; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 6px; }
  .status span { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; }
  .errors { font-size: 14px; font-weight: 500; color: var(--hot); text-align: center; }

  /* Écran code d'accès */
  .gate { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(20,32,26,0.25); }
  .gate.open { display: flex; }
  .gate form { width: min(380px, 100%); border-radius: 30px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .gate h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 34px; }
  .gate label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  .gate input { height: 48px; border-radius: 16px; border: 1px solid rgba(20,32,26,0.2); background: rgba(255,255,255,0.8); padding: 0 14px; font: 16px var(--sans); color: var(--ink); }
  .gate button { height: 48px; border-radius: 24px; border: 0; background: var(--forest); color: var(--accent); font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .gate .err { font-size: 13px; color: var(--hot); min-height: 18px; }

  /* Squelette de chargement */
  .skel { border-radius: 30px; min-height: 140px; }

  /* iPad et grands écrans */
  @media (min-width: 820px) {
    .app { padding-left: max(28px, env(safe-area-inset-left)); padding-right: max(28px, env(safe-area-inset-right)); gap: 16px; }
    .grid { gap: 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: row dense; align-items: stretch; }
    .grid > * { grid-column: span var(--span, 1); order: var(--o-t, 0); }
    .wide .list { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .wide .timeline::before { display: none; }
    .wide .timeline.list { display: grid; row-gap: 20px; }
    .tile { padding: 24px; border-radius: 30px; }
    .top p { font-size: 28px; line-height: 1.25; }
    .rest { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .stats { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .stat { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "k v" "s v"; align-items: center; column-gap: 12px; padding: 16px 20px; }
    .stat .k { grid-area: k; align-self: end; }
    .stat .s { grid-area: s; align-self: start; }
    .stat .v { grid-area: v; font-size: 56px; }
  }
  /* Bouton « Tout voir » et panneau */
  .more { align-self: flex-start; margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 0; cursor: pointer; font-size: 15px; font-weight: 700; background: var(--forest); color: var(--accent); }
  .slack .more { background: var(--accent); color: var(--forest); }
  .brief .more { background: rgba(30,58,43,0.12); color: var(--forest); }
  .head-actions .more { margin: 0; min-height: 36px; padding: 0 14px; font-size: 14px; }
  .sheet-backdrop { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); background: rgba(20,32,26,0.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .sheet-backdrop[hidden] { display: none; }
  .sheet-wrap { position: relative; width: min(820px, 100%); max-height: 100%; display: flex; }
  #sheetBody { width: 100%; max-height: calc(100dvh - 40px); overflow: auto; border-radius: 30px; -webkit-overflow-scrolling: touch; }
  #sheetBody .tile { min-height: 0; height: auto; }
  #sheetBody .fit { overflow: visible; max-height: none; -webkit-mask-image: none; mask-image: none; }
  #sheetBody .glass { --glass: rgba(252, 250, 238, 0.95); }
  #sheetBody .list { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  #sheetBody .timeline::before { display: none; }
  #sheetBody .timeline.list { display: grid; row-gap: 20px; }
  .sheet-close { position: absolute; top: 14px; right: 14px; z-index: 2; }
  #sheetBody .tile-head { padding-right: 56px; }
  body.sheet-open { overflow: hidden; }

  /* ============ Écran unique : iPad paysage, ordinateur ============ */
  @media (min-width: 900px) and (orientation: landscape) and (min-height: 620px) {
    html, body { height: 100%; overflow: hidden; }
    .app { height: 100dvh; max-width: 1600px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "hello top" "grid grid" "err status"; gap: 14px 16px; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    .topbar { grid-area: top; align-self: start; }
    header.hello { grid-area: hello; padding: 0 4px; }
    header.hello h1 { font-size: clamp(36px, 4.6vh, 52px); }
    header.hello p { margin-top: 6px; font-size: 16px; max-width: 60ch; }
    .banner { display: none; }
    .grid { grid-area: grid; height: 100%; min-height: 0; grid-template-rows: fit-content(60%) minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); }
    .grid > :not(.brief) { contain: size; }
    .topbar { justify-content: flex-end; }
    .errors { grid-area: err; align-self: center; text-align: left; }
    .status { grid-area: status; padding: 0; justify-content: flex-end; flex-wrap: nowrap; }
    .status span { white-space: nowrap; }
    .errors { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tile { min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 20px 22px; }
    .fit { flex: 1 1 auto; min-height: 0; overflow: hidden; }
    .tile.clipped .fit { -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent); mask-image: linear-gradient(to bottom, #000 82%, transparent); }
    .brief { gap: 12px; }
    .brief .fit { display: flex; flex-direction: column; gap: 12px; }
    .top { padding: 16px; gap: 10px; flex-shrink: 0; }
    .top p { font-size: clamp(20px, 2.7vh, 30px); }
    .cta { min-height: 42px; }
    .rest { gap: 10px; }
    .rest-item p { font-size: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rest-item .n { font-size: 24px; }
    .brief-foot { display: none; }
    .stats { min-height: 0; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .stat { min-height: 0; padding: 12px 18px; }
    .stat .v { font-size: clamp(40px, 5.5vh, 60px); }
  }

  /* ============ Écran unique : iPad portrait ============ */
  @media (min-width: 700px) and (orientation: portrait) and (min-height: 900px) {
    html, body { height: 100%; overflow: hidden; }
    .app { height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "hello top" "grid grid" "err status"; gap: 14px 16px; padding: max(20px, env(safe-area-inset-top)) 24px max(14px, env(safe-area-inset-bottom)); }
    .topbar { grid-area: top; align-self: start; }
    header.hello { grid-area: hello; padding: 0 4px; }
    header.hello h1 { font-size: 44px; }
    header.hello p { margin-top: 6px; font-size: 16px; }
    .banner { display: none; }
    .grid { grid-area: grid; height: 100%; min-height: 0; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: fit-content(48%) auto; grid-auto-rows: minmax(0, 1fr); }
    .grid > :not(.brief):not(.stats) { contain: size; }
    .topbar { justify-content: flex-end; }
    .grid > * { grid-column: span var(--span-p, 1); order: var(--o-p, 0); }
    .errors { grid-area: err; align-self: center; text-align: left; }
    .status { grid-area: status; padding: 0; justify-content: flex-end; flex-wrap: nowrap; }
    .status span { white-space: nowrap; }
    .errors { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tile { min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 20px 22px; }
    .fit { flex: 1 1 auto; min-height: 0; overflow: hidden; }
    .tile.clipped .fit { -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent); mask-image: linear-gradient(to bottom, #000 82%, transparent); }
    .brief .fit { display: flex; flex-direction: column; gap: 12px; }
    .top { flex-shrink: 0; }
    .top p { font-size: 26px; }
    .rest-item p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rest { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .brief-foot { display: none; }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stat { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "k v" "s v"; align-items: center; column-gap: 10px; padding: 14px 16px; }
    .stat .k { grid-area: k; align-self: end; }
    .stat .s { grid-area: s; align-self: start; }
    .stat .v { grid-area: v; font-size: 44px; }
    .tile[style*="--span-p:2"] .list { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .tile[style*="--span-p:2"] .timeline::before { display: none; }
    .tile[style*="--span-p:2"] .timeline.list { display: grid; row-gap: 16px; }
  }

  @media (prefers-reduced-motion: reduce) { .loading .round svg { animation: none; } }
</style>
</head>
<body>

<div class="scenery" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<main class="app" id="app">
  <div class="topbar">
    <span class="pill glass" id="today">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="todayText"></span>
    </span>
    <div class="right">
      <span class="pill glass"><small>Mis à jour</small><span id="updated">--:--</span></span>
      <button class="round glass" id="refresh" aria-label="Recharger le dernier brief">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
  </div>

  <header class="hello">
    <h1 id="greeting">Bonjour</h1>
    <p id="headline">Je prépare ton brief…</p>
  </header>

  <span class="banner" id="demoBanner" hidden>Aperçu · données d’exemple</span>

  <div class="grid" id="grid">
    <div class="tile skel glass" style="--span:2"></div>
    <div class="tile skel glass"></div>
    <div class="tile skel glass"></div>
  </div>

  <div class="errors" id="errors"></div>
  <div class="status" id="status"></div>
</main>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="Détail">
    <button class="round glass sheet-close" id="sheetClose" type="button" aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
(() => {
  const KEY = 'bento.key';
  const CACHE = 'bento.brief';
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const safeUrl = (u) => (/^https?:\/\//.test(u || '') ? u : null);
  const FALLBACK = { gmail: 'https://mail.google.com/', slack: 'https://app.slack.com/client', studio: 'https://studio.goklimb.com/' };
  const linkAttrs = (u, src) => { const url = safeUrl(u) || FALLBACK[src]; return url ? `href="${esc(url)}" target="_blank" rel="noopener"` : ''; };
  const GO = '<svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';
  const TZ = 'Europe/Paris';

  function sameDay(a, b) {
    const f = (d) => d.toLocaleDateString('fr-FR', { timeZone: TZ });
    return f(a) === f(b);
  }
  function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    if (sameDay(d, now)) return d.toLocaleTimeString('fr-FR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
    const y = new Date(now); y.setDate(y.getDate() - 1);
    if (sameDay(d, y)) return 'Hier';
    return d.toLocaleDateString('fr-FR', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  }
  function fmtDue(p) {
    if (p.done) return 'Livré';
    if (!p.due) return '';
    const d = new Date(p.due + (p.due.length === 10 ? 'T12:00:00' : ''));
    if (isNaN(d)) return String(p.due);
    return d.toLocaleDateString('fr-FR', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  }
  function initials(name) {
    const parts = String(name).replace(/[^\p{L}\s]/gu, ' ').trim().split(/\s+/);
    return ((parts[0]?.[0] || '') + (parts[1]?.[0] || parts[0]?.[1] || '')).toUpperCase();
  }
  const AVATARS = ['#FFD9CC', '#E4F7A8', '#D7E9F2', '#F6DDF0', '#FFE9B8'];
  const avatarColor = (name) => AVATARS[[...String(name)].reduce((a, c) => a + c.charCodeAt(0), 0) % AVATARS.length];
  const SOURCE = { gmail: 'Gmail', slack: 'Slack', studio: 'Studio' };
  const plural = (n, s) => `${n} ${s}${n > 1 ? 's' : ''}`;

  function setHeader(data) {
    const now = new Date();
    $('todayText').textContent = now.toLocaleDateString('fr-FR', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
    const hour = Number(now.toLocaleTimeString('fr-FR', { timeZone: TZ, hour: '2-digit' }).slice(0, 2));
    const hello = hour >= 18 ? 'Bonsoir' : 'Bonjour';
    const name = data?.name || 'Sholy';
    $('greeting').innerHTML = `${hello} <em>${esc(name)}</em>`;
    if (data) {
      $('headline').textContent = data.headline || '';
      $('updated').textContent = fmtTime(data.generatedAt);
      $('demoBanner').hidden = !data.demo;
    }
  }

  function renderBrief(d, L = '') {
    const [top, ...rest] = d.essentials || [];
    if (!top) return `<section class="tile brief"><div class="tile-head"><h2>L’essentiel</h2></div><p class="empty">Rien à signaler.</p></section>`;
    const restHtml = rest.map((e, i) => `
      <a class="rest-item" ${linkAttrs(e.link, e.source)} aria-label="Ouvrir dans ${esc(SOURCE[e.source] || '')}">
        <span class="n" aria-hidden="true">${i + 2}</span>
        <span><p>${rich(e.text)}</p><span class="meta">${esc([SOURCE[e.source], fmtTime(e.time)].filter(Boolean).join(' · '))}</span></span>
      </a>`).join('');
    const c = d.counts || {};
    return `
      <section class="tile brief" data-key="brief" ${L} aria-labelledby="t-brief">
        <div class="tile-head"><h2 id="t-brief">L’essentiel</h2><span>Résumé IA · ${esc(fmtTime(d.generatedAt))}</span></div>
        <div class="fit">
        <div class="top">
          <span class="overline"><span class="prio">Priorité 1</span>${esc([SOURCE[top.source], fmtTime(top.time)].filter(Boolean).join(' · '))}</span>
          <p>${rich(top.text)}</p>
          ${top.action ? `<a class="cta" ${linkAttrs(top.link, top.source)}>${esc(top.action)} <span aria-hidden="true">→</span></a>` : ''}
        </div>
        ${rest.length ? `<div class="rest">${restHtml}</div>` : ''}
        </div>
        <button class="more" type="button" hidden>Tout voir</button>
        <div class="brief-foot">${esc(d.readSummary || `${plural(c.mailsTotal ?? 0, 'mail')}, ${plural((c.slackMentions ?? 0) + (c.slackDms ?? 0), 'message')} Slack et ${plural((d.projects || []).length, 'projet')} Studio lus pour toi`)}</div>
      </section>`;
  }

  function renderStats(d, L = '') {
    const c = d.counts || {};
    const src = d.sources || {};
    const off = (k) => src[k] === 'off' || src[k] === 'reconnect' || src[k] === 'error';
    const stats = [
      off('gmail') ? { k: 'Mails', v: '–', s: src.gmail === 'reconnect' ? 'Gmail à reconnecter' : 'Gmail non branché' } : { k: 'Mails', v: c.mailsImportant ?? 0, s: `importants sur ${c.mailsTotal ?? 0} non lus` },
      { k: 'Slack', v: (d.slack || []).filter((x) => x.awaitingReply).length, s: 'attendent ta réponse' },
      off('studio') ? { k: 'Studio', v: '–', s: 'pas encore branché' } : { k: 'Studio', v: c.studioHot ?? 0, s: 'deadlines sous 7 jours', hot: (c.studioHot ?? 0) > 0 }
    ];
    return `<div class="stats" ${L}>${stats.map((s) => `
      <div class="stat glass">
        <span class="k">${esc(s.k)}</span>
        <span class="v ${s.hot ? 'hot' : ''}">${esc(s.v)}</span>
        <span class="s">${esc(s.s)}</span>
      </div>`).join('')}</div>`;
  }

  function renderMails(d, L = '') {
    const list = d.mails || [];
    const rows = list.map((m) => `
      <a class="row" ${linkAttrs(m.link, 'gmail')} title="Ouvrir le mail dans Gmail">
        <span class="avatar" aria-hidden="true" style="background:${avatarColor(m.from)}">${esc(initials(m.from))}</span>
        <span class="row-body">
          <span class="row-top"><b>${esc(m.from)}</b><span class="time">${esc(fmtTime(m.time))}${GO}</span></span>
          <span class="subject">${esc(m.subject)}</span>
          <span class="tags"><span class="tag ${esc(m.tag)}">${esc({ urgent: 'Urgent', client: 'Client', valider: 'À valider', info: 'Info' }[m.tag] || 'Info')}</span><span>${esc(m.why || '')}</span></span>
        </span>
      </a>`).join('');
    const reconnect = (d.sources || {}).gmail === 'reconnect';
    return `
      <section class="tile glass mails ${W(L)}" data-key="mails" ${L} aria-labelledby="t-mails">
        <div class="tile-head"><h2 id="t-mails">Mails importants ${list.length ? `<span class="badge">${list.length}</span>` : ''}</h2><span class="head-actions"><button class="more" type="button" hidden>Tout voir</button><a href="https://mail.google.com/" target="_blank" rel="noopener">Ouvrir</a></span></div>
        ${rows ? `<div class="list fit">${rows}</div>` : (reconnect ? '<p class="empty">Gmail est à reconnecter dans les réglages de Claude (Connecteurs) pour que je puisse trier tes mails.</p>' : '<p class="empty">Aucun mail important. Belle journée.</p>')}
        ${reconnect ? '' : `<div class="foot">${(d.otherMails ?? 0) > 1 ? `${esc(d.otherMails)} autres mails peuvent attendre` : `${esc(d.otherMails ?? 0)} autre mail peut attendre`}</div>`}
      </section>`;
  }

  function renderSlack(d, L = '') {
    const list = (d.slack || []).slice(0, 5);
    const waiting = list.filter((s) => s.awaitingReply).length;
    const rows = list.map((s) => `
      <a class="row" ${linkAttrs(s.link, 'slack')} title="Ouvrir le message dans Slack">
        <span class="row-top">
          <span><b>${s.unread ? '<i class="udot" aria-label="Non lu"></i>' : ''}${esc(s.who)}</b> <span class="where">${esc(s.where === 'DM' ? 'en privé' : s.where === 'Groupe' ? 'en groupe' : s.where)}</span></span>
          <span class="time">${esc(fmtTime(s.time))}${GO}</span>
        </span>
        <span class="txt">${esc(s.text)}</span>
        ${(s.awaitingReply || s.count > 1) ? `<span class="meta">${s.awaitingReply ? '<span class="await">Attend ta réponse</span>' : ''}${s.count > 1 ? `<span class="msgs">${esc(s.count)} messages</span>` : ''}</span>` : ''}
      </a>`).join('');
    return `
      <section class="tile dark slack ${W(L)}" data-key="slack" ${L} aria-labelledby="t-slack">
        <div class="tile-head"><h2 id="t-slack">Slack ${waiting ? `<span class="badge" title="Attendent ta réponse">${waiting}</span>` : ''}</h2><span class="head-actions"><button class="more" type="button" hidden>Tout voir</button><a href="https://app.slack.com/client" target="_blank" rel="noopener">Ouvrir</a></span></div>
        ${rows ? `<div class="list fit">${rows}</div>` : '<p class="empty">Rien qui t’attend sur Slack.</p>'}
      </section>`;
  }

  function renderStudio(d, L = '') {
    const rows = (d.projects || []).map((p) => `
      <div class="proj">
        <span class="dot ${p.done ? 'done' : p.hot ? 'hot' : ''}" aria-hidden="true"></span>
        <div class="proj-body">
          <div class="proj-top"><b>${esc(p.client)}</b><span class="due ${p.hot ? 'hot' : ''}">${esc(fmtDue(p))}</span></div>
          ${p.what ? `<span class="what">${esc(p.what)}</span>` : ''}
          ${p.pct !== null && p.pct !== undefined ? `<div class="bar" role="img" aria-label="Avancement ${Math.round(Number(p.pct))} %"><i style="width:${Math.max(0, Math.min(100, Number(p.pct)))}%"></i></div>` : ''}
        </div>
      </div>`).join('');
    return `
      <section class="tile glass studio ${W(L)}" data-key="studio" ${L} aria-labelledby="t-studio">
        <div class="tile-head"><h2 id="t-studio">Studio KLIMB</h2><span class="head-actions"><button class="more" type="button" hidden>Tout voir</button><a href="${esc(d.studioUrl || 'https://studio.goklimb.com/')}" target="_blank" rel="noopener">Ouvrir</a></span></div>
        ${rows ? `<div class="timeline list fit">${rows}</div>` : '<p class="empty">Source Studio pas encore branchée.</p>'}
      </section>`;
  }

  function renderStatus(d) {
    const labels = { ok: 'OK', off: 'pas branché', error: 'erreur', demo: 'exemple', reconnect: 'à reconnecter' };
    const colors = { ok: 'background:rgba(30,58,43,0.85);color:#D7F75B', off: 'background:rgba(252,250,238,0.7);color:#2E3B33', error: 'background:#FFD9CC;color:#8A2E12', demo: 'background:rgba(252,250,238,0.7);color:#2E3B33', reconnect: 'background:#FFD9CC;color:#8A2E12' };
    const s = d.sources || {};
    $('status').innerHTML = ['gmail', 'slack', 'studio', 'ai'].map((k) => {
      const v = s[k] || 'off';
      return `<span style="${colors[v] || colors.off}">${esc({ gmail: 'Gmail', slack: 'Slack', studio: 'Studio', ai: 'IA' }[k])} : ${esc(labels[v] || v)}</span>`;
    }).join('');
    $('errors').textContent = (d.errors || []).join(' · ');
  }

  // Mise en page pilotée par le contenu (iPad et ordinateur : grille de 4 colonnes)
  // Ligne 1 : L'essentiel (2) + compteurs (1) + la section qui a le moins de contenu (1)
  // Ligne 2 : les deux autres sections, la plus remplie prend plus de place (2+2 ou 3+1)
  // Sur iPhone : une colonne, les sections les plus remplies d'abord
  const W = (L) => (/--span:(2|3|4)/.test(L) ? 'wide' : '');
  function layout(d) {
    const src = d.sources || {};
    const off = (k) => ['off', 'reconnect', 'error'].includes(src[k]);
    const isOff = { mails: off('gmail'), slack: off('slack'), studio: off('studio') };
    const n = {
      mails: isOff.mails ? 0 : (d.mails || []).length,
      slack: isOff.slack ? 0 : (d.slack || []).length,
      studio: isOff.studio ? 0 : (d.projects || []).length
    };
    const prio = { slack: 0.2, mails: 0.1, studio: 0 }; // à égalité, Slack puis Mails passent devant
    // Une source débranchée n'a pas de bloc : les compteurs et les pastilles du bas le signalent déjà
    const active = ['mails', 'slack', 'studio'].filter((k) => !isOff[k]).sort((a, b) => (n[b] + prio[b]) - (n[a] + prio[a]));
    const [big, mid, small] = active;
    // span = paysage (4 colonnes, 2 lignes) · sp = portrait (2 colonnes) · ot/op/om = ordre paysage/portrait/iPhone
    const L = (span, ot, om, sp, op) => `style="--span:${span};--o-t:${ot};--o-m:${om};--span-p:${sp};--o-p:${op}"`;
    const out = { mails: 'hidden', slack: 'hidden', studio: 'hidden' };
    out.stats = L(1, 1, 1, 2, 1);
    if (active.length === 0) {
      out.brief = L(3, 0, 0, 2, 0);
    } else if (active.length === 1) {
      out.brief = L(3, 0, 0, 2, 0); out[big] = L(4, 2, 2, 2, 2);
    } else if (active.length === 2) {
      if (n[mid] <= 2) { out.brief = L(2, 0, 0, 2, 0); out[mid] = L(1, 2, 3, 1, 3); out[big] = L(4, 3, 2, 1, 2); }
      else { out.brief = L(3, 0, 0, 2, 0); out[big] = L(2, 2, 2, 1, 2); out[mid] = L(2, 3, 3, 1, 3); }
    } else {
      // Ligne 1 : essentiel (2) + compteurs (1) + la section la plus courte (1)
      // Ligne 2 : les deux autres, la plus remplie prend plus de place
      const wideBig = n[mid] === 0 || n[big] >= 2.5 * n[mid];
      out.brief = L(2, 0, 0, 2, 0); out[small] = L(1, 2, 4, 1, 4);
      out[big] = L(wideBig ? 3 : 2, 3, 2, 2, 2); out[mid] = L(wideBig ? 1 : 2, 4, 3, 1, 3);
    }
    return out;
  }

  function render(d) {
    setHeader(d);
    const lay = layout(d);
    $('grid').innerHTML = renderBrief(d, lay.brief) + renderStats(d, lay.stats) + (lay.mails === 'hidden' ? '' : renderMails(d, lay.mails)) + (lay.slack === 'hidden' ? '' : renderSlack(d, lay.slack)) + (lay.studio === 'hidden' ? '' : renderStudio(d, lay.studio));
    renderStatus(d);
    requestAnimationFrame(fitTiles);
  }

  // Écran unique (iPad, ordinateur) : chaque bloc montre ce qui rentre, « Tout voir » ouvre le reste
  function fitTiles() {
    document.querySelectorAll('#grid .tile[data-key]').forEach((tile) => {
      const fit = tile.querySelector('.fit');
      const btn = tile.querySelector('.more');
      if (!fit || !btn) return;
      const clipped = fit.scrollHeight > fit.clientHeight + 4;
      tile.classList.toggle('clipped', clipped);
      btn.hidden = !clipped;
      if (clipped) {
        const box = fit.getBoundingClientRect();
        const items = [...fit.children];
        const hiddenCount = items.filter((el) => el.getBoundingClientRect().bottom > box.bottom + 2).length;
        btn.textContent = hiddenCount && tile.dataset.key !== 'brief' ? `Tout voir (+${hiddenCount})` : 'Tout voir';
      }
    });
  }
  let fitTimer = null;
  window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitTiles, 120); });

  let lastFocus = null;
  function openSheet(tile) {
    const clone = tile.cloneNode(true);
    clone.removeAttribute('style');
    clone.classList.remove('clipped');
    clone.classList.add('in-sheet', 'wide');
    clone.querySelectorAll('.more').forEach((b) => b.remove());
    clone.querySelectorAll('[id]').forEach((el) => el.removeAttribute('id'));
    $('sheetBody').replaceChildren(clone);
    lastFocus = document.activeElement;
    $('sheet').hidden = false;
    document.body.classList.add('sheet-open');
    $('sheetClose').focus();
  }
  function closeSheet() {
    $('sheet').hidden = true;
    document.body.classList.remove('sheet-open');
    $('sheetBody').replaceChildren();
    if (lastFocus) lastFocus.focus();
  }
  $('grid').addEventListener('click', (e) => {
    const btn = e.target.closest('.more');
    if (btn) openSheet(btn.closest('.tile'));
  });
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  // Données d'exemple tant que le premier brief n'est pas arrivé
  function demoBrief() {
    const now = new Date();
    const at = (h, m, off = 0) => { const d = new Date(now); d.setDate(d.getDate() + off); d.setHours(h, m, 0, 0); return d.toISOString(); };
    const inDays = (n) => { const d = new Date(now); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
    return {
      demo: true, name: 'Sholy', generatedAt: now.toISOString(),
      headline: 'Aperçu avec des données d’exemple. Le premier vrai brief arrive bientôt.',
      essentials: [
        { text: '**Marc attend tes pistes Nova** avant **17h**, pour le comité de lundi.', source: 'gmail', time: at(11, 42), action: 'Envoyer les pistes' },
        { text: '**Helio a répondu** sur la piste collage : **2 retours** à intégrer.', source: 'gmail', time: at(10, 15) },
        { text: '**Slack calme** : rien ne bloque avant lundi.', source: 'slack', time: at(12, 58) }
      ],
      counts: { mailsImportant: 3, mailsTotal: 23, slackMentions: 2, slackDms: 3, slackUnread: 2, studioHot: 2 },
      mails: [
        { from: 'Marc · Nova', subject: 'Pistes DA ASCII pour le comité de lundi', time: at(11, 42), tag: 'urgent', why: 'Deadline aujourd’hui' },
        { from: 'Helio', subject: 'Retours sur la piste collage papier', time: at(10, 15), tag: 'client', why: 'Réponse attendue' },
        { from: 'Orbit', subject: 'BAT merch tee + sweat à valider', time: at(9, 3), tag: 'valider', why: 'Fichier joint' }
      ],
      otherMails: 20,
      slack: [
        { where: '#nova-studio', who: 'Léo', text: '@Alex tu peux partager le lien Figma des pistes ?', time: at(12, 58), unread: true, awaitingReply: true, count: 1 },
        { where: 'DM', who: 'Clara', text: 'J’ai mis dans le channel Nova les retours, tu pourras jeter un œil !', time: at(12, 6), unread: true, awaitingReply: true, count: 2 },
        { where: 'DM', who: 'Hugo', text: 'Point process design décalé à 16h', time: at(11, 20), count: 1 },
        { where: 'Groupe', who: 'Inès', text: 'Sinon à part ça c’est bon ?', time: at(10, 1), awaitingReply: true, count: 3 },
        { where: '#studio', who: 'Sarah', text: '@Alex dispo pour une review Atlas lundi ?', time: at(17, 40, -1), count: 1 }
      ],
      projects: [
        { client: 'Nova', what: 'Rebranding', due: inDays(3), pct: 70, hot: true },
        { client: 'Helio', what: 'Pistes créatives', due: inDays(7), pct: 45, hot: true },
        { client: 'Ledger', what: 'Audit de marque', due: inDays(11), pct: 30 },
        { client: 'Orbit', what: 'Merch', due: null, pct: 100, done: true }
      ],
      sources: { gmail: 'demo', slack: 'demo', studio: 'demo', ai: 'demo' },
      errors: []
    };
  }

  const useCap = (n) => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n) : Promise.resolve(null);

  // Le brief est écrit toutes les heures par Claude dans la base de la page (document brief/latest)
  let stop = null;
  let gotLive = false;
  function note(msg) { $('errors').textContent = msg || ''; }

  async function connect() {
    document.body.classList.add('loading');
    const timer = setTimeout(() => { if (!gotLive) note('Le dernier brief ne répond pas encore, affichage de la dernière version connue.'); }, 10000);
    const db = await useCap('db');
    if (!db) {
      clearTimeout(timer);
      document.body.classList.remove('loading');
      note('Connecte-toi à claude.ai pour voir ton brief.');
      return;
    }
    if (stop) stop();
    stop = db.doc('brief/latest').onSnapshot((snap) => {
      if (!snap.metadata.fromCache) { gotLive = true; clearTimeout(timer); document.body.classList.remove('loading'); }
      const data = snap.exists ? snap.data() : null;
      if (data) { render(data); if (!snap.metadata.fromCache) note((data.errors || []).join(' · ')); }
      else if (!snap.metadata.fromCache) render(demoBrief());
    }, (err) => {
      clearTimeout(timer);
      document.body.classList.remove('loading');
      note('Impossible de lire le brief (' + err.code + ').');
    });
  }

  $('refresh').addEventListener('click', async () => {
    const db = await useCap('db');
    if (!db) return;
    document.body.classList.add('loading');
    try { const snap = await db.doc('brief/latest').get(); if (snap.exists) render(snap.data()); }
    catch (e) { note('Impossible d’actualiser (' + (e.code || 'erreur') + ').'); }
    finally { document.body.classList.remove('loading'); }
  });

  setHeader(null);
  render(demoBrief());
  connect();
})();
</script>
